spring:
  application:
    name: infrastructure
  datasource:
    url: jdbc:postgresql://localhost:5432/infrastructure
    username: infrastructure
    password: infrastructure
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

infrastructure:
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    header-name: Idempotency-Key
    path-prefixes:
      - /api/
    pending-ttl-seconds: ${IDEMPOTENCY_PENDING_TTL:60}
    completed-ttl-seconds: ${IDEMPOTENCY_COMPLETED_TTL:3600}
    max-key-length: 255
    max-cached-body-bytes: 1048576
  filestore:
    default-provider: ${FILESTORE_PROVIDER:local}
    default-bucket: infrastructure
    upload:
      max-size-bytes: 52428800
      default-ttl-seconds: 3600
      max-ttl-seconds: 86400
    download:
      default-ttl-seconds: 300
      max-ttl-seconds: 3600
    local:
      root: ${FILESTORE_LOCAL_ROOT:./data/filestore}
      public-base-url: ${FILESTORE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/api/files/transfer}
      bucket: infrastructure
      signing-key: ${FILESTORE_LOCAL_SIGNING_KEY:dev-only-change-me}
    minio:
      enabled: ${FILESTORE_MINIO_ENABLED:false}
      endpoint: ${FILESTORE_MINIO_ENDPOINT:http://minio:9000}
      public-endpoint: ${FILESTORE_MINIO_PUBLIC_ENDPOINT:}
      region: us-east-1
      access-key: ${FILESTORE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${FILESTORE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${FILESTORE_MINIO_BUCKET:infrastructure}
    oss:
      enabled: ${FILESTORE_OSS_ENABLED:false}
      endpoint: ${FILESTORE_OSS_ENDPOINT:}
      public-endpoint: ${FILESTORE_OSS_PUBLIC_ENDPOINT:}
      region: ${FILESTORE_OSS_REGION:oss-cn-shanghai}
      access-key: ${FILESTORE_OSS_ACCESS_KEY:}
      secret-key: ${FILESTORE_OSS_SECRET_KEY:}
      bucket: ${FILESTORE_OSS_BUCKET:}
    cos:
      enabled: ${FILESTORE_COS_ENABLED:false}
      endpoint: ${FILESTORE_COS_ENDPOINT:}
      public-endpoint: ${FILESTORE_COS_PUBLIC_ENDPOINT:}
      region: ${FILESTORE_COS_REGION:ap-shanghai}
      access-key: ${FILESTORE_COS_ACCESS_KEY:}
      secret-key: ${FILESTORE_COS_SECRET_KEY:}
      bucket: ${FILESTORE_COS_BUCKET:}
    s3:
      enabled: ${FILESTORE_S3_ENABLED:false}
      endpoint: ${FILESTORE_S3_ENDPOINT:}
      public-endpoint: ${FILESTORE_S3_PUBLIC_ENDPOINT:}
      region: ${FILESTORE_S3_REGION:us-east-1}
      access-key: ${FILESTORE_S3_ACCESS_KEY:}
      secret-key: ${FILESTORE_S3_SECRET_KEY:}
      bucket: ${FILESTORE_S3_BUCKET:}

jimmer:
  language: kotlin
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: read_only
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: infrastructure
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

infrastructure:
  security:
    access-token-ttl: 30m
    refresh-token-ttl: 7d
  observability:
    trace-header: X-Trace-Id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
